{% extends "sports_hub_app/base.html" %}

{% block content %}
<div class="container mt-4">

    <h1 class="text-center">Forgot Password</h1>

    <p class="text-center">
        Reset your account password
    </p>

    <form method="POST">
        {% csrf_token %}

        <div>
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                required
            >
        </div>

        <div class="text-center">
            <button type="submit">
                Continue
            </button>
        </div>
    </form>

    <div class="text-center">
        <a href="{% url 'login' %}">
            Back to Login
        </a>
    </div>

</div>
{% endblock %}
