<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Sports Hub</title>
</head>
<body>

    <h1 style="text-align: center;">Forgot Password</h1>
    <p style="text-align: center;">Reset your account password</p>

    <form method="post">
        {% csrf_token %}

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br><br>

        <button type="submit">Continue</button>
    </form>

    <p>
        <a href="{% url 'login' %}">Back to Login</a>
    </p>

</body>
</html>
