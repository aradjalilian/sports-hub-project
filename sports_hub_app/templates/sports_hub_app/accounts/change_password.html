<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Sports Hub</title>
</head>
<body>

    <h1 style="text-align: center;">Change Password</h1>
    <p style="text-align: center;">Change your account password</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Change Password</button>
    </form>

    <p>
        <a href="{% url 'profile' %}">Back to Profile</a>
    </p>

</body>
</html>
