{% extends "sports_hub_app/base.html" %}
{% load static %}

{% block title %}Products | SportsHub{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4 text-center">Products</h1>

    <div class="row">
        {% for product in products %}
            <div class="col-md-4 mb-4">
                {% include "sports_hub_app/products/product_card.html" %}
            </div>
        {% empty %}
            <div class="text-center py-5">
                <img src="{% static 'sports_hub_app/images/empty_products.png' %}" 
                     alt="No Products" 
                     width="120" 
                     class="opacity-75 mb-3">
                <h4>No products available</h4>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
