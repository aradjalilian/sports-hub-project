{% extends "sports_hub_app/base.html" %}
{% load static %}

{% block title %}Delete {{ product.name }} | SportsHub{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4 text-danger">Delete Product</h1>

    <div class="card p-4 shadow-sm">
        <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>

        <form method="POST">
            {% csrf_token %}
            <button class="btn btn-danger w-100 mt-3">Yes, Delete</button>
        </form>

        <a href="{% url 'product_detail' product.id %}" class="btn btn-secondary w-100 mt-3">
            Cancel
        </a>
    </div>
</div>
{% endblock %}
