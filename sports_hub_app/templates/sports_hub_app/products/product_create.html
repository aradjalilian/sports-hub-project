{% extends "sports_hub_app/base.html" %}

{% block title %}Add Product | SportsHub{% endblock %}

{% block content %}
<div class="container py-4">

    <h1 class="mb-4 text-center">Create Product</h1>

    <form
        method="POST"
        enctype="multipart/form-data"
        class="card p-4 shadow-sm"
    >
        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-success w-100 mt-3"
        >
            Create Product
        </button>
    </form>

    <a
        href="{% url 'product_list' %}"
        class="btn btn-secondary w-100 mt-3"
    >
        Back to Products
    </a>

</div>
{% endblock %}
