{% extends "sports_hub_app/base.html" %}

{% block title %}Home | SportsHub{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">Welcome to SportsHub</h1>

        <p class="lead text-muted">
            Your trusted store for sports gear.
        </p>

        <a href="{% url 'product_list' %}" class="btn btn-primary btn-lg mt-3">
            Shop Now
        </a>
    </div>

    <div class="row text-center">
        <h2 class="mb-4">Categories</h2>

        <div class="col-md-3 mb-3">
            <a href="{% url 'product_list' %}?category=Football"
               class="text-decoration-none text-dark">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Football</h5>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="{% url 'product_list' %}?category=Basketball"
               class="text-decoration-none text-dark">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Basketball</h5>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="{% url 'product_list' %}?category=Running"
               class="text-decoration-none text-dark">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Running</h5>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="{% url 'product_list' %}?category=Tennis"
               class="text-decoration-none text-dark">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Tennis</h5>
                    </div>
                </div>
            </a>
        </div>

    </div>

</div>

{% endblock %}
