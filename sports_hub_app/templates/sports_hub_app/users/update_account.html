{% extends "sports_hub_app/base.html" %}
{% load static %}

{% block content %}
<div class="update-container">
    <h1>Update Account Details</h1>

    <form method="POST" class="update-form">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn-save">Save Changes</button>
    </form>

    <a href="{% url 'profile' %}" class="btn-back">Back to Profile</a>
</div>

<style>
.update-container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}
.update-form {
    background: #f7f7f7;
    padding: 20px;
    border-radius: 8px;
}
.btn-save {
    background: #007bff;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
.btn-save:hover { background: #0056b3; }
.btn-back {
    display: inline-block;
    margin-top: 20px;
    color: #007bff;
}
</style>
{% endblock %}
