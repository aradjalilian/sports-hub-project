{% extends "sports_hub_app/base.html" %}

{% block content %}
<div class="update-container">
    <h1 class="text-center">Update Account Details</h1>

    <form method="POST" class="update-form">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn-save d-block mx-auto">
            Save Changes
        </button>
    </form>

    <div class="center">
        <a href="{% url 'profile' %}" class="btn-back">
            Back to Profile
        </a>
    </div>
</div>
{% endblock %}
