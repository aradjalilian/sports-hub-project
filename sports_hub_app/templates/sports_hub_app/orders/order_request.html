{% extends "sports_hub_app/base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">Order Request</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Order Request
        </button>
    </form>

    <div class="text-center">
        <a href="{% url 'order_list' %}">
            Back to Orders
        </a>
    </div>
</div>
{% endblock %}
