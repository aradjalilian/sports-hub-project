<!DOCTYPE html>
<html lang="en">
<head>
    <title>Products</title>
</head>
<body>

<h1>Sports Hub Products</h1>

{% for product in products %}
    <div>
        <h2>{{ product.name }}</h2>
        <p>{{ product.description }}</p>
        <p>Price: €{{ product.price }}</p>
        <p>Stock: {{ product.stock }}</p>
        <p>Status: {{ product.status }}</p>
    </div>
{% empty %}
    <p>No products available.</p>
{% endfor %}

</body>
</html>
